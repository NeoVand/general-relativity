<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" width="1000" height="505" role="img" aria-labelledby="title desc"><title id="title">A slowly turning orbit</title><desc id="desc">Three aligned-focus ellipses have progressively rotated perihelia. Their offset is greatly exaggerated. The curves are schematic successive Kepler ellipses, compressed vertically for layout, not a numerical integration of an exact relativistic orbit. The text derives the small secular advance and states its regime.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="505" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">25 / A SLOWLY TURNING ORB
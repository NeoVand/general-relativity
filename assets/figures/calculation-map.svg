<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" width="1000" height="505" role="img" aria-labelledby="title desc"><title id="title">From a metric to a measurement</title><desc id="desc">Six stages organize a general relativity calculation, from specifying the metric to checking physical limits. The observer can often be chosen earlier. This map is a practical organizing sequence; it is not a claim that every problem needs every tensor computed explicitly.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="505" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">40 / FROM A METRIC TO A MEASUREMENT</text><rect x="45" y="105" width="285" height="125" rx="8" fill="#fff" stroke="#087f8c"/><text x="65.00" y="137.00" font-size="18" fill="#087f8c" text-anchor="start" font-weight="700">1</text><text x="65.00" y="169.00" font-size="21" fill="#183746" text-anchor="start" font-weight="650">Specify the metric</text><text x="65.00" y="201.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">Coordinates and units</text><path d="M336.00,168.00 L358.00,168.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><rect x="367" y="105" width="285" height="125" rx="8" fill="#fff" stroke="#087f8c"/><text x="387.00" y="137.00" font-size="18" fill="#087f8c" text-anchor="start" font-weight="700">2</text><text x="387.00" y="169.00" font-size="21" fill="#183746" text-anchor="start" font-weight="650">Compute the connection</text><text x="387.00" y="201.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">First derivatives of g</text><path d="M658.00,168.00 L680.00,168.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><rect x="689" y="105" width="285" height="125" rx="8" fill="#fff" stroke="#087f8c"/><text x="709.00" y="137.00" font-size="18" fill="#087f8c" text-anchor="start" font-weight="700">3</text><text x="709.00" y="169.00" font-size="21" fill="#183746" text-anchor="start" font-weight="650">Compute curvature</text><text x="709.00" y="201.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">Derivatives + products of Γ</text><rect x="45" y="285" width="285" height="125" rx="8" fill="#fff" stroke="#b95730"/><text x="65.00" y="317.00" font-size="18" fill="#b95730" text-anchor="start" font-weight="700">4</text><text x="65.00" y="349.00" font-size="21" fill="#183746" text-anchor="start" font-weight="650">Choose the observer</text><text x="65.00" y="381.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">Four-velocity or tetrad</text><path d="M336.00,348.00 L358.00,348.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><rect x="367" y="285" width="285" height="125" rx="8" fill="#fff" stroke="#b95730"/><text x="387.00" y="317.00" font-size="18" fill="#b95730" text-anchor="start" font-weight="700">5</text><text x="387.00" y="349.00" font-size="21" fill="#183746" text-anchor="start" font-weight="650">Predict a measurement</text><text x="387.00" y="381.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">Clock, ray, orbit, or tide</text><path d="M658.00,348.00 L680.00,348.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><rect x="689" y="285" width="285" height="125" rx="8" fill="#fff" stroke="#b95730"/><text x="709.00" y="317.00" font-size="18" fill="#b95730" text-anchor="start" font-weight="700">6</text><text x="709.00" y="349.00" font-size="21" fill="#183746" text-anchor="start" font-weight="650">Check a familiar limit</text><text x="709.00" y="381.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">Signs, units, and physics</text><text x="500.00" y="467.00" font-size="20" fill="#183746" text-anchor="middle" font-weight="400">The invariant prediction is the destination. The coordinates are the route.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">The information question has a shape</title><desc id="desc">A schematic entropy curve rises and returns to zero, while a dashed comparison curve continues to rise. Axes are qualitative and the curves are not a quantitative evaporation solution. A final pure radiation state has zero fine-grained entropy for the whole radiation system; individual portions can remain mixed.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">38 / THE INFORMATION QUESTION HAS A SHAPE</text><path d="M80.00,380.00 L545.00,380.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><path d="M80.00,380.00 L80.00,140.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><text x="545.00" y="415.00" font-size="18" fill="#526e7b" text-anchor="end" font-weight="400">fraction of evaporation elapsed</text><g transform="rotate(-90 40 260.0)"><text x="40.00" y="260.00" font-size="18" fill="#526e7b" text-anchor="middle" font-weight="400">radiation entropy (schematic)</text></g><path d="M105.00,375.00 L315.00,160.00 L520.00,375.00" stroke="#087f8c" stroke-width="4" fill="none"/><path d="M105.00,375.00 L520.00,140.00" stroke="#b95730" stroke-width="3" fill="none" stroke-dasharray="7 5"/><text x="610.00" y="155.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Unitary expectation</text><text x="610.00" y="183.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Rise, then fall as information is recovered.</text><text x="610.00" y="260.00" font-size="22" fill="#b95730" text-anchor="start" font-weight="650">Uncorrected semiclassical trend</text><text x="610.00" y="288.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Keeps growing in the leading approximation.</text><text x="610.00" y="363.00" font-size="19" fill="#183746" text-anchor="start" font-weight="400">A thermal-looking spectrum can still</text><text x="610.00" y="394.00" font-size="19" fill="#183746" text-anchor="start" font-weight="400">contain correlations between quanta.</text></g></svg>
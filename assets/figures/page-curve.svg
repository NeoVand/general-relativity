<svg class="gr-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="page-curve-title page-curve-desc"><title id="page-curve-title">The information question has a shape</title><desc id="page-curve-desc">A schematic entropy curve rises and returns to zero, while a dashed comparison curve continues to rise. Axes are qualitative and the curves are not a quantitative evaporation solution. A final pure radiation state has zero fine-grained entropy for the whole radiation system; individual portions can remain mixed.</desc><style>.gr-figure text{font-family:Manrope,Arial,sans-serif}.gr-figure .math-geometry{color:var(--geometry,#007c78)}.gr-figure .math-curvature{color:var(--curvature,#7951bb)}.gr-figure .math-transport{color:var(--transport,#275dc5)}.gr-figure .math-matter{color:var(--matter,#a25e00)}.gr-figure .math-observer{color:var(--observer,#bb365d)}@media(prefers-color-scheme:dark){svg.gr-figure:not(.embedded){--ink:#ebedf0;--muted:#a8b0bf;--geometry:#64d9c9;--curvature:#bd9cff;--transport:#8bb5ff;--matter:#f3c16e;--observer:#ff99b4;--line:#343e4f;--paper:#141b29;--figure-bg:#192231;--figure-tint:#243549}}</style><defs><marker id="page-curve-183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink,#20262c)"/></marker><marker id="page-curve-526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#626971)"/></marker><marker id="page-curve-087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--geometry,#007c78)"/></marker><marker id="page-curve-b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--observer,#bb365d)"/></marker><marker id="page-curve-4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--transport,#275dc5)"/></marker><marker id="page-curve-b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--matter,#a25e00)"/></marker><marker id="page-curve-d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line,#d9dddf)"/></marker></defs><rect width="1000" height="480" fill="var(--figure-bg,#f3f4f2)"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="var(--muted,#626971)" text-anchor="start" font-weight="650">38 / THE INFORMATION QUESTION HAS A SHAPE</text><path d="M80.00,380.00 L545.00,380.00" fill="none" stroke="var(--muted,#626971)" stroke-width="2" marker-end="url(#page-curve-526e7b)"/><path d="M80.00,380.00 L80.00,140.00" fill="none" stroke="var(--muted,#626971)" stroke-width="2" marker-end="url(#page-curve-526e7b)"/><text x="545.00" y="415.00" font-size="18" fill="var(--muted,#626971)" text-anchor="end" font-weight="400">fraction of evaporation elapsed</text><g transform="rotate(-90 40 260.0)"><text x="40.00" y="260.00" font-size="18" fill="var(--muted,#626971)" text-anchor="middle" font-weight="400">radiation entropy (schematic)</text></g><path d="M105.00,375.00 L315.00,160.00 L520.00,375.00" stroke="var(--geometry,#007c78)" stroke-width="4" fill="none"/><path d="M105.00,375.00 L520.00,140.00" stroke="var(--observer,#bb365d)" stroke-width="3" fill="none" stroke-dasharray="7 5"/><text x="610.00" y="155.00" font-size="22" fill="var(--geometry,#007c78)" text-anchor="start" font-weight="650">Unitary expectation</text><text x="610.00" y="183.00" font-size="17" fill="var(--muted,#626971)" text-anchor="start" font-weight="400">Rise, then fall as information is recovered.</text><text x="610.00" y="260.00" font-size="22" fill="var(--observer,#bb365d)" text-anchor="start" font-weight="650">Uncorrected semiclassical trend</text><text x="610.00" y="288.00" font-size="17" fill="var(--muted,#626971)" text-anchor="start" font-weight="400">Keeps growing in the leading approximation.</text><text x="610.00" y="363.00" font-size="19" fill="var(--ink,#20262c)" text-anchor="start" font-weight="400">A thermal-looking spectrum can still</text><text x="610.00" y="394.00" font-size="19" fill="var(--ink,#20262c)" text-anchor="start" font-weight="400">contain correlations between quanta.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">The source has more than one kind of entry</title><desc id="desc">A four-by-four stress-energy matrix colors energy density, mixed energy-momentum entries, and spatial stresses differently. S is energy flux, π is momentum density, and σ denotes the spatial stress entries using the momentum-flux convention. The tensor is symmetric in ordinary metric GR.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">17 / THE SOURCE HAS MORE THAN ONE KIND OF ENTRY</text><text x="50.00" y="100.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Energy and momentum, in one local inertial frame</text><text x="50.00" y="128.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Coordinates x⁰ = ct. Every entry has energy-density units.</text><rect x="75" y="155" width="85" height="55" rx="4" fill="#d9eeee" stroke="#d5e2e7"/><text x="117.00" y="191.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">ε</text><rect x="165" y="155" width="85" height="55" rx="4" fill="#f6e8de" stroke="#d5e2e7"/><text x="207.00" y="191.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">Sₓ/c</text><rect x="255" y="155" width="85" height="55" rx="4" fill="#f6e8de" stroke="#d5e2e7"/><text x="297.00" y="191.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">Sᵧ/c</text><rect x="345" y="155" width="85" height="55" rx="4" fill="#f6e8de" stroke="#d5e2e7"/><text x="387.00" y="191.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">S𝓏/c</text><rect x="75" y="215" width="85" height="55" rx="4" fill="#f6e8de" stroke="#d5e2e7"/><text x="117.00" y="251.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">cπₓ</text><rect x="165" y="215" width="85" height="55" rx="4" fill="#e3eaf5" stroke="#d5e2e7"/><text x="207.00" y="251.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">σₓₓ</text><rect x="255" y="215" width="85" height="55" rx="4" fill="#e3eaf5" stroke="#d5e2e7"/><text x="297.00" y="251.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">σₓᵧ</text><rect x="345" y="215" width="85" height="55" rx="4" fill="#e3eaf5" stroke="#d5e2e7"/><text x="387.00" y="251.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">σₓ𝓏</text><rect x="75" y="275" width="85" height="55" rx="4" fill="#f6e8de" stroke="#d5e2e7"/><text x="117.00" y="311.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">cπᵧ</text><rect x="165" y="275" width="85" height="55" rx="4" fill="#e3eaf5" stroke="#d5e2e7"/><text x="207.00" y="311.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">σᵧₓ</text><rect x="255" y="275" width="85" height="55" rx="4" fill="#e3eaf5" stroke="#d5e2e7"/><text x="297.00" y="311.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">σᵧᵧ</text><rect x="345" y="275" width="85" height="55" rx="4" fill="#e3eaf5" stroke="#d5e2e7"/><text x="387.00" y="311.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">σᵧ𝓏</text><rect x="75" y="335" width="85" height="55" rx="4" fill="#f6e8de" stroke="#d5e2e7"/><text x="117.00" y="371.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">cπ𝓏</text><rect x="165" y="335" width="85" height="55" rx="4" fill="#e3eaf5" stroke="#d5e2e7"/><text x="207.00" y="371.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">σ𝓏ₓ</text><rect x="255" y="335" width="85" height="55" rx="4" fill="#e3eaf5" stroke="#d5e2e7"/><text x="297.00" y="371.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">σ𝓏ᵧ</text><rect x="345" y="335" width="85" height="55" rx="4" fill="#e3eaf5" stroke="#d5e2e7"/><text x="387.00" y="371.00" font-size="24" fill="#183746" text-anchor="middle" font-weight="400">σ𝓏𝓏</text><text x="535.00" y="177.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Energy density</text><text x="535.00" y="205.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">ε: what the observer finds locally.</text><text x="535.00" y="261.00" font-size="22" fill="#b95730" text-anchor="start" font-weight="650">Energy flow ↔ momentum density</text><text x="535.00" y="289.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">For symmetric T: S/c = cπ.</text><text x="535.00" y="345.00" font-size="22" fill="#4267a1" text-anchor="start" font-weight="650">Stress</text><text x="535.00" y="373.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Diagonal pressure; off-diagonal shear.</text></g></svg>
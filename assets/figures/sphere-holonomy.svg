<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc"><title id="title">A sphere remembers the loop</title><desc id="desc">An orthographic spherical octant connects the north pole with two equatorial points ninety degrees apart. The returned tangent arrow differs from the initial arrow. Great-circle transport around this octant rotates a tangent vector by 90°. Projection changes apparent angles on the page; the right angles and 90° rotation are intrinsic to the sphere.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="560" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">13 / A SPHERE REMEMBERS THE LOOP</text><text x="585.00" y="105.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Three right-angle turns</text><text x="585.00" y="133.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">A spherical octant has angle excess π/2.</text><circle cx="330.00" cy="290.00" r="235.00" stroke="#d5e2e7" fill="#e9f0f3" stroke-width="2"/><path d="M473.91,469.02 L466.18,473.26 L458.08,477.25 L449.62,481.00 L440.84,484.48 L431.76,487.70 L422.39,490.63 L412.78,493.28 L402.93,495.63 L392.89,497.69 L382.67,499.43 L372.31,500.87 L361.84,501.99 L351.27,502.79 L340.65,503.28 L330.00,503.44 L319.35,503.28 L308.73,502.79 L298.16,501.99 L287.69,500.87 L277.33,499.43 L267.11,497.69 L257.07,495.63 L247.22,493.28 L237.61,490.63 L228.24,487.70 L219.16,484.48 L210.38,481.00 L201.92,477.25 L193.82,473.26 L186.09,469.02 L178.76,464.56 L171.84,459.88 L165.35,455.00 L159.32,449.93 L153.75,444.69 L148.67,439.28 L144.08,433.73 L140.00,428.05 L136.44,422.25 L133.42,416.35 L130.93,410.37 L128.99,404.32 L127.60,398.22 L126.76,392.09 L126.48,385.94 L126.76,379.79 L127.60,373.66 L128.99,367.56 L130.93,361.51 L133.42,355.53 L136.44,349.63 L140.00,343.83 L144.08,338.15 L148.67,332.59 L153.75,327.19 L159.32,321.94 L165.35,316.87 L171.84,311.99 L178.76,307.32 L186.09,302.85 L193.82,298.62 L201.92,294.62 L210.38,290.88 L219.16,287.39 L228.24,284.18 L237.61,281.25 L247.22,278.60 L257.07,276.24 L267.11,274.19 L277.33,272.44 L287.69,271.01 L298.16,269.88 L308.73,269.08 L319.35,268.60 L330.00,268.44 L340.65,268.60 L351.27,269.08 L361.84,269.88 L372.31,271.01 L382.67,272.44 L392.89,274.19 L402.93,276.24 L412.78,278.60 L422.39,281.25 L431.76,284.18 L440.84,287.39 L449.62,290.88 L458.08,294.62 L466.18,298.62 L473.91,302.85 L481.24,307.32 L488.16,311.99 L494.65,316.87 L500.68,321.94 L506.25,327.19 L511.33,332.59 L515.92,338.15 L520.00,343.83 L523.56,349.63 L526.58,355.53 L529.07,361.51 L531.01,367.56 L532.40,373.66 L533.24,379.79 L
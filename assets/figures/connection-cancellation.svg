<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">The connection cancels a false change</title><desc id="desc">The partial derivative of the radial vector component is minus sine theta; its Christoffel correction is plus sine theta. This is an exact calculation on the flat polar plane. The derivative direction is θ. The full indexed equation in the chapter identifies the single connection coefficient used in this cancellation.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">12 / THE CONNECTION CANCELS A FALSE CHANGE</text><text x="50.00" y="100.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Polar components of an eastward unit vector</text><rect x="50" y="145" width="400" height="115" rx="8" fill="#fff" stroke="#d5e2e7"/><text x="250.00" y="190.00" font-size="29" fill="#087f8c" text-anchor="middle" font-weight="400">Vʳ = cos θ</text><text x="250.00" y="235.00" font-size="29" fill="#087f8c" text-anchor="middle" font-weight="400">Vᶿ = −sin θ / r</text><rect x="550" y="145" width="400" height="115" rx="8" fill="#fff" stroke="#d5e2e7"/><text x="750.00" y="186.00" font-size="20" fill="#b95730" text-anchor="middle" font-weight="400">Relevant connection coefficient</text><text x="750.00" y="231.00" font-size="32" fill="#b95730" text-anchor="middle" font-weight="400">−r</text><path d="M250.00,275.00 L250.00,313.00" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#087f8c)"/><path d="M750.00,275.00 L750.00,313.00" fill="none" stroke="#b95730" stroke-width="2" marker-end="url(#b95730)"/><text x="500.00" y="365.00" font-size="31" fill="#183746" text-anchor="middle" font-weight="400">−sin θ  +  (−r)(−sin θ/r)  =  0</text><text x="500.00" y="425.00" font-size="21" fill="#526e7b" text-anchor="middle" font-weight="400">Partial change + basis correction = zero covariant change.</text></g></svg>
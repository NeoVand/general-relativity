<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 495" width="1000" height="495" role="img" aria-labelledby="title desc"><title id="title">A century of consequences</title><desc id="desc">Ten dated milestones progress from Newton’s Principia to the first direct gravitational-wave detection. Dates label selected developments, not a complete priority history. The 2015 LIGO event was publicly reported in 2016. The text discusses the collaborative and iterative development of the field equations.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="495" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">03 / A CENTURY OF CONSEQUENCES</text><text x="45.00" y="90.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">A route through discovery</text><text x="45.00" y="118.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">The teaching sequence is not the historical sequence.</text><path d="M55.00,175.00 L200.00,175.00" fill="none" stroke="#d5e2e7" stroke-width="3"/><circle cx="55.00" cy="175.00" r="5.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="55.00" y="155.00" font-size="23" fill="#087f8c" text-anchor="start" font-weight="650">1687</text><text x="55.00" y="212.00" font-size="19" fill="#183746" text-anchor="start" font-weight="600">Newton</text><text x="55.00" y="241.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">one</text><text x="55.00" y="264.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">law of gravity</text><path d="M245.00,175.00 L390.00,175.00" fill="none" stroke="#d5e2e7" stroke-width="3"/><circle cx="245.00" cy="175.00" r="5.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="245.00" y="155.00" font-size="23" fill="#087f8c" text-anchor="start" font-weight="650">1905</text><text x="245.00" y="212.00" font-size="19" fill="#183746" text-anchor="start" font-weight="600">Einstein</text><text x="245.00" y="241.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">special</text><text x="245.00" y="264.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">relativity</text><path d="M435.00,175.00 L580.00,175.00" fill="none" stroke="#d5e2e7" stroke-width="3"/><circle cx="435.00" cy="175.00" r="5.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="435.00" y="155.00" font-size="23" fill="#087f8c" text-anchor="start" font-weight="650">1907</text><text x="435.00" y="212.00" font-size="19" fill="#183746" text-anchor="start" font-weight="600">Free fall</text><text x="435.00" y="241.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">equivalence</text><text x="435.00" y="264.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">principle</text><path d="M625.00,175.00 L770.00,175.00" fill="none" stroke="#d5e2e7" stroke-width="3"/><circle cx="625.00" cy="175.00" r="5.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="625.00" y="155.00" font-size="23" fill="#087f8c" text-anchor="start" font-weight="650">1908</text><text x="625.00" y="212.00" font-size="19" fill="#183746" text-anchor="start" font-weight="600">Minkowski</text><text x="625.00" y="241.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">spacetime</text><text x="625.00" y="264.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">geometry</text><path d="M815.00,175.00 L960.00,175.00" fill="none" stroke="#d5e2e7" stroke-width="3"/><circle cx="815.00" cy="175.00" r="5.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="815.00" y="155.00" font-size="23" fill="#087f8c" text-anchor="start" font-weight="650">1912–13</text><text x="815.00" y="212.00" font-size="19" fill="#183746" text-anchor="start" font-weight="600">Grossmann</text><text x="815.00" y="241.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">geometric</text><text x="815.00" y="264.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">collaboration</text><path d="M55.00,350.00 L200.00,350.00" fill="none" stroke="#d5e2e7" stroke-width="3"/><circle cx="55.00" cy="350.00" r="5.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="55.00" y="330.00" font-size="23" fill="#087f8c" text-anchor="start" font-weight="650">1915</text><text x="55.00" y="387.00" font-size="19" fill="#183746" text-anchor="start" font-weight="600">Field equation</text><text x="55.00" y="416.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">the</text><text x="55.00" y="439.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">November papers</text><path d="M245.00,350.00 L390.00,350.00" fill="none" stroke="#d5e2e7" stroke-width="3"/><circle cx="245.00" cy="350.00" r="5.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="245.00" y="330.00" font-size="23" fill="#087f8c" text-anchor="start" font-weight="650">1916</text><text x="245.00" y="387.00" font-size="19" fill="#183746" text-anchor="start" font-weight="600">Schwarzschild</text><text x="245.00" y="416.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">a</text><text x="245.00" y="439.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">spherical solution</text><path d="M435.00,350.00 L580.00,350.00" fill="none" stroke="#d5e2e7" stroke-width="3"/><circle cx="435.00" cy="350.00" r="5.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="435.00" y="330.00" font-size="23" fill="#087f8c" text-anchor="start" font-weight="650">1963</text><text x="435.00" y="387.00" font-size="19" fill="#183746" text-anchor="start" font-weight="600">Kerr</text><text x="435.00" y="416.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">a</text><text x="435.00" y="439.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">rotating solution</text><path d="M625.00,350.00 L770.00,350.00" fill="none" stroke="#d5e2e7" stroke-width="3"/><circle cx="625.00" cy="350.00" r="5.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="625.00" y="330.00" font-size="23" fill="#087f8c" text-anchor="start" font-weight="650">1974</text><text x="625.00" y="387.00" font-size="19" fill="#183746" text-anchor="start" font-weight="600">Hawking</text><text x="625.00" y="416.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">black-hole</text><text x="625.00" y="439.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">radiation</text><path d="M815.00,350.00 L960.00,350.00" fill="none" stroke="#d5e2e7" stroke-width="3"/><circle cx="815.00" cy="350.00" r="5.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="815.00" y="330.00" font-size="23" fill="#087f8c" text-anchor="start" font-weight="650">2015</text><text x="815.00" y="387.00" font-size="19" fill="#183746" text-anchor="start" font-weight="600">LIGO</text><text x="815.00" y="416.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">first</text><text x="815.00" y="439.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">direct GW detection</text></g></svg>
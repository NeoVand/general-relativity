<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Two variations make one field equation</title><desc id="desc">A two-branch flowchart separates the variation of scalar curvature from the variation of the invariant volume. The boundary divergence requires its own treatment. After that treatment, the bulk coefficient of the arbitrary inverse-metric variation is the Einstein tensor.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">21 / TWO VARIATIONS MAKE ONE FIELD EQUATION</text><text x="50.00" y="100.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">The product rule behind Einstein’s equation</text><text x="50.00" y="128.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Vary both factors in √−g R.</text><rect x="65" y="150" width="385" height="95" rx="8" fill="#fff" stroke="#087f8c"/><text x="257.00" y="190.00" font-size="23" fill="#087f8c" text-anchor="middle" font-weight="400">Curvature changes</text><text x="257.00" y="224.00" font-size="24" fill="#087f8c" text-anchor="middle" font-weight="400">√−g δR</text><path d="M257.00,255.00 L257.00,295.00" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#087f8c)"/><rect x="545" y="150" width="385" height="95" rx="8" fill="#fff" stroke="#b95730"/><text x="737.00" y="190.00" font-size="23" fill="#b95730" text-anchor="middle" font-weight="400">Volume changes</text><text x="737.00" y="224.00" font-size="24" fill="#b95730" text-anchor="middle" font-weight="400">R δ√−g</text><path d="M737.00,255.00 L737.00,295.00" fill="none" stroke="#b95730" stroke-width="2" marker-end="url(#b95730)"/><text x="258.00" y="333.00" font-size="23" fill="#087f8c" text-anchor="middle" font-weight="400">Ricci + a boundary divergence</text><text x="738.00" y="333.00" font-size="23" fill="#b95730" text-anchor="middle" font-weight="400">−½ scalar curvature × metric</text><path d="M258.00,350.00 L460.00,398.00" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#087f8c)"/><path d="M738.00,350.00 L540.00,398.00" fill="none" stroke="#b95730" stroke-width="2" marker-end="url(#b95730)"/><text x="500.00" y="440.00" font-size="26" fill="#183746" text-anchor="middle" font-weight="400">Together: the Einstein tensor</text></g></svg>
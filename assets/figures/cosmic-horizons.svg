<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">A causal horizon is not just a distance scale</title><desc id="desc">Past and future light rays in conformal coordinates meet initial and finite future boundaries. The diagram depicts a model with finite past and future conformal intervals. Their lengths determine particle and event horizons. Other expansion histories can lack one or both boundaries; c/H is a different construction.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">32 / A CAUSAL HORIZON IS NOT JUST A DISTANCE SCALE</text><text x="45.00" y="95.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Three quantities that should not share one name</text><text x="45.00" y="123.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Here χ is comoving distance and η is conformal time; c = 1.</text><path d="M90.00,385.00 L530.00,385.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><path d="M90.00,385.00 L90.00,150.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><text x="530.00" y="420.00" font-size="18" fill="#526e7b" text-anchor="end" font-weight="400">comoving distance χ</text><g transform="rotate(-90 50 267.5)"><text x="50.00" y="267.50" font-size="18" fill="#526e7b" text-anchor="middle" font-weight="400">conformal time η</text></g><circle cx="285.00" cy="205.00" r="6.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><path d="M105.00,385.00 L285.00,205.00 L465.00,385.00" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M100.00,165.00 L500.00,165.00" fill="none" stroke="#b95730" stroke-width="2" stroke-dasharray="6 5"/><path d="M285.00,205.00 L245.00,165.00" fill="none" stroke="#b95730" stroke-width="3"/><path d="M285.00,205.00 L325.00,165.00" fill="none" stroke="#b95730" stroke-width="3"/><text x="290.00" y="234.00" font-size="17" fill="#087f8c" text-anchor="start" font-weight="400">now</text><text x="105.00" y="445.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">initial conformal boundary</text><text x="108.00" y="153.00" font-size="16" fill="#b95730" text-anchor="start" font-weight="400">finite future conformal boundary</text><text x="585.00" y="155.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Particle horizon</text><text x="585.00" y="183.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">How far light has reached us since the start.</text><text x="585.00" y="255.00" font-size="22" fill="#b95730" text-anchor="start" font-weight="650">Event horizon</text><text x="585.00" y="283.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">How far a signal sent now can ever reach.</text><text x="585.00" y="355.00" font-size="22" fill="#4267a1" text-anchor="start" font-weight="650">Hubble radius: c/H</text><text x="585.00" y="383.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">An expansion scale; not generally a causal horizon.</text></g></svg>
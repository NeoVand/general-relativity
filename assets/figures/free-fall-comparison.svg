<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">One laboratory is not enough</title><desc id="desc">One worldline is compared with a pair of approaching free-fall worldlines, with time increasing upward. The paired experiment measures relative acceleration. Curved drawn paths are coordinate schematics; their appearance alone is not evidence of curvature.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">02 / ONE LABORATORY IS NOT ENOUGH</text><text x="55.00" y="90.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">One falling observer</text><text x="55.00" y="118.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">An accelerometer reads zero.</text><text x="545.00" y="90.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Two falling observers</text><text x="545.00" y="118.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Their separation can change.</text><path d="M480.00,80.00 L480.00,390.00" fill="none" stroke="#d5e2e7" stroke-width="2"/><path d="M115.00,370.00 L390.00,370.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><path d="M115.00,370.00 L115.00,160.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><text x="390.00" y="405.00" font-size="18" fill="#526e7b" text-anchor="end" font-weight="400">position</text><g transform="rotate(-90 75 265.0)"><text x="75.00" y="265.00" font-size="18" fill="#526e7b" text-anchor="middle" font-weight="400">time</text></g><path d="M240.00,355.00 L240.56,351.00 L241.12,347.00 L241.68,343.00 L242.24,339.00 L242.80,335.00 L243.35,331.00 L243.91,327.00 L244.46,323.00 L245.01,319.00 L245.56,315.00 L246.11,311.00 L246.66,307.00 L247.20,303.00 L247.74,299.00 L248.27,295.00 L248.81,291.00 L249.34,287.00 L249.86,283.00 L250.39,279.00 L250.90,275.00 L251.42,271.00 L251.93,267.00 L252.43,263.00 L252.93,259.00 L253.42,255.00 L253.91,251.00 L254.40,247.00 L254.87,243.00 L255.34,239.00 L255.81,235.00 L256.27,231.00 L256.72,227.00 L257.17,223.00 L257.61,219.00 L258.04,215.00 L258.46,211.00 L258.88,207.00 L259.29,203.00 L259.69,199.00 L260.09,195.00 L260.47,191.00 L260.85,187.00 L261.22,183.00 L261.58,179.00 L261.93,175.00 L262.28,171.00 L262.61,167.00 L262.94,163.00 L263.25,159.00" stroke="#087f8c" stroke-width="4" fill="none"/><circle cx="253.00" cy="265.00" r="7.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="280.00" y="260.00" font-size="26" fill="#087f8c" text-ancho
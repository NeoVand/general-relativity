<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Do not confuse a route with its parameter</title><desc id="desc">Two identical straight paths have respectively equally spaced and nonuniformly spaced parameter labels. This flat straight-line illustration isolates parameter choice. Affine parameters are related by λ ↦ aλ + b; an arbitrary nonlinear relabeling changes the standard coordinate form of the geodesic equation.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">10 / DO NOT CONFUSE A ROUTE WITH ITS PARAMETER</text><text x="45.00" y="95.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">The same path can wear different parameters</text><text x="45.00" y="123.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">The curve stays fixed; the labels along it can speed up or slow down.</text><path d="M65.00,200.00 L920.00,200.00" fill="none" stroke="#526e7b" stroke-width="2"/><circle cx="80.00" cy="200.00" r="6.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="80.00" y="236.00" font-size="17" fill="#087f8c" text-anchor="middle" font-weight="400">0</text><circle cx="190.00" cy="200.00" r="6.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="190.00" y="236.00" font-size="17" fill="#087f8c" text-anchor="middle" font-weight="400">1</text><circle cx="300.00" cy="200.00" r="6.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="300.00" y="236.00" font-size="17" fill="#087f8c" text-anchor="middle" font-weight="400">2</text><circle cx="410.00" cy="200.00" r="6.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="410.00" y="236.00" font-size="17" fill="#087f8c" text-anchor="middle" font-weight="400">3</text><circle cx="520.00" cy="200.00" r="6.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="520.00" y="236.00" font-size="17" fill="#087f8c" text-anchor="middle" font-weight="400">4</text><circle cx="630.00" cy="200.00" r="6.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="630.00" y="236.00" font-size="17" fill="#087f8c" text-anchor="middle" font-weight="400">5</text><circle cx="740.00" cy="200.00" r="6.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="740.00" y="236.00" font-size="17" fill="#087f8c" text-anchor="middle" font-weight="400">6</text><circle cx="850.00" cy="200.00" r="6.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><text x="850.00" y="236.00" font-size="17" fill="#087f8c" text-anchor="middle" font-weight="400">7</text><text x="65.00" y="158.00" font-size="23" fill="#087f8c" text-anchor="start" font-weight="400">Affine parameter</text><path d="M65.00,350.00 L920.00,350.00" fill="none" stroke="#526e7b" stroke-width="2"/><circle cx="80.00" cy="350.00" r="6.00" stroke="#b95730" fill="#b95730" stroke-width="2"/><text x="80.00" y="386.00" font-size="17" fill="#b95730" text-anchor="middle" font-weight="400">0</text><circle cx="109.86" cy="350.00" r="6.00" stroke="#b95730" fill="#b95730" stroke-width="2"/><text x="109.86" y="386.00" font-size="17" fill="#b95730" text-anchor="middle" font-weight="400">1</text><circle cx="166.43" cy="350.00" r="6.00" stroke="#b95730" fill="#b95730" stroke-width="2"/><text x="166.43" y="386.00" font-size="17" fill="#b95730" text-anchor="middle" font-weight="400">2</text><circle cx="249.71" cy="350.00" r="6.00" stroke="#b95730" fill="#b95730" stroke-width="2"/><text x="249.71" y="386.00" font-size="17" fill="#b95730" text-anchor="middle" font-weight="400">3</text><circle cx="359.71" cy="350.00" r="6.00" stroke="#b95730" fill="#b95730" stroke-width="2"/><text x="359.71" y="386.00" font-size="17" fill="#b95730" text-anchor="middle" font-weight="400">4</text><circle cx="496.43" cy="350.00" r="6.00" stroke="#b95730" fill="#b95730" stroke-width="2"/><text x="496.43" y="386.00" font-size="17" fill="#b95730" text-anchor="middle" font-weight="400">5</text><circle cx="659.86" cy="350.00" r="6.00" stroke="#b95730" fill="#b95730" stroke-width="2"/><text x="659.86" y="386.00" font-size="17" fill="#b95730" text-anchor="middle" font-weight="400">6</text><circle cx="850.00" cy="350.00" r="6.00" stroke="#b95730" fill="#b95730" stroke-width="2"/><text x="850.00" y="386.00" font-size="17" fill="#b95730" text-anchor="middle" font-weight="400">7</text><text x="65.00" y="308.00" font-size="23" fill="#b95730" text-anchor="start" font-weight="400">Non-affine parameter</text><text x="500.00" y="442.00" font-size="19" fill="#526e7b" text-anchor="middle" font-weight="400">A non-affine parameter can add a tangent-proportional term to the geodesic equation.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Two histories between the same events</title><desc id="desc">A home clock follows a vertical worldline for ten years. A traveller reaches three light-years in five years and returns in another five. The idealized travelling clock accumulates 10√(1 − 0.6²) = 8 years. The sharp turnaround is an approximation; the path integral, not a local feeling of slow time, gives the age difference.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">06 / TWO HISTORIES BETWEEN THE SAME EVENTS</text><path d="M100.00,380.00 L570.00,380.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><path d="M100.00,380.00 L100.00,120.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><text x="570.00" y="415.00" font-size="18" fill="#526e7b" text-anchor="end" font-weight="400">distance (light-years)</text><g transform="rotate(-90 60 250.0)"><text x="60.00" y="250.00" font-size="18" fill="#526e7b" text-anchor="middle" font-weight="400">time (years)</text></g><path d="M160.00,370.00 L160.00,120.00" fill="none" stroke="#087f8c" stroke-width="4"/><path d="M160.00,370.00 L310.00,245.00 L160.00,120.00" stroke="#b95730" stroke-width="4" fill="none"/><circle cx="160.00" cy="370.00" r="6.00" stroke="#183746" fill="#183746" stroke-width="2"/><circle cx="160.00" cy="120.00" r="6.00" stroke="#183746" fill="#183746" stroke-width="2"/><text x="130.00" y="375.00" font-size="17" fill="#526e7b" text-anchor="end" font-weight="400">0</text><text x="130.00" y="250.00" font-size="17" fill="#526e7b" text-anchor="end" font-weight="400">5</text><text x="130.00" y="125.00" font-size="17" fill="#526e7b" text-anchor="end" font-weight="400">10</text><text x="310.00" y="411.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">3</text><text x="630.00" y="150.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Home clock</text><text x="630.00" y="178.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">10 years along the vertical path.</text><text x="630.00" y="245.00" font-size="22" fill="#b95730" text-anchor="start" font-weight="650">Travelling clock</text><text x="630.00" y="273.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">8 years at speed 0.6c.</text><text x="630.00" y="345.00" font-size="19" fill="#183746" text-anchor="start" font-weight="400">Same departure. Same reunion.</text><text x="630.00" y="376.00" font-size="19" fill="#183746" text-anchor="start" font-weight="400">Different lengths in spacetime.</text></g></svg>
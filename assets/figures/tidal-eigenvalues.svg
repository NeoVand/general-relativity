<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Stretching and squeezing near Earth</title><desc id="desc">Radial particles accelerate apart; tangential particles accelerate toward one another. The three tidal acceleration eigenvalues sum to zero. The labels give eigenvalues of the Newtonian relative-acceleration matrix, not curvature components: divide by c² for the corresponding curvature scale, with the convention-dependent sign tracked in the text.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">16 / STRETCHING AND SQUEEZING NEAR EARTH</text><text x="50.00" y="95.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Vacuum tides near a spherical mass</text><text x="50.00" y="123.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Radial stretching balances two tangential squeezes.</text><circle cx="270.00" cy="280.00" r="65.00" stroke="#526e7b" fill="none" stroke-width="2"/><circle cx="270.00" cy="215.00" r="5.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><path d="M270.00,215.00 L270.00,160.00" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#087f8c)"/><circle cx="270.00" cy="345.00" r="5.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><path d="M270.00,345.00 L270.00,400.00" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#087f8c)"/><circle cx="205.00" cy="280.00" r="5.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><path d="M205.00,280.00 L240.00,280.00" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#087f8c)"/><circle cx="335.00" cy="280.00" r="5.00" stroke="#087f8c" fill="#087f8c" stroke-width="2"/><path d="M335.00,280.00 L300.00,280.00" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#087f8c)"/><text x="250.00" y="165.00" font-size="18" fill="#087f8c" text-anchor="end" font-weight="400">radial</text><rect x="590" y="145" width="345" height="255" rx="8" fill="#fff" stroke="#d5e2e7"/><text x="625.00" y="190.00" font-size="16" fill="#526e7b" text-anchor="start" font-weight="400">Relative acceleration / separation</text><text x="625.00" y="245.00" font-size="25" fill="#087f8c" text-anchor="start" font-weight="400">radial      +2GM/r³</text><text x="625.00" y="291.00" font-size="25" fill="#b95730" text-anchor="start" font-weight="400">tangent    −GM/r³</text><text x="625.00" y="337.00" font-size="25" fill="#b95730" text-anchor="start" font-weight="400">tangent    −GM/r³</text><text x="625.00" y="377.00" font-size="18" fill="#183746" text-anchor="start" font-weight="400">sum = 0 in exterior vacuum</text><text x="45.00" y="448.00" font-size="18" fill="#526e7b" text-anchor="start" font-weight="400">Earth, at its surface: radial separation acceleration ≈ 3.08 μm/s² per metre of separation.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Two physical degrees of freedom, counted honestly</title><desc id="desc">Twelve initial-data functions lose four constraints and four gauge directions, leaving four phase-space functions. This is the local canonical count for ordinary four-dimensional GR, with first-class constraints. Four remaining phase-space functions describe two propagating configuration degrees of freedom.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">34 / TWO PHYSICAL DEGREES OF FREEDOM, COUNTED HONESTLY</text><text x="45.00" y="95.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Count initial data in phase space</text><text x="45.00" y="123.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Positions and their conjugate momenta are counted separately.</text><rect x="60" y="150" width="265" height="125" rx="8" fill="#fff" stroke="#087f8c"/><text x="192.00" y="207.00" font-size="43" fill="#087f8c" text-anchor="middle" font-weight="400">12</text><text x="192.00" y="247.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">6 metric + 6 momentum</text><rect x="365" y="150" width="265" height="125" rx="8" fill="#fff" stroke="#087f8c"/><text x="497.00" y="207.00" font-size="43" fill="#087f8c" text-anchor="middle" font-weight="400">−4</text><text x="497.00" y="247.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">constraint equations</text><rect x="670" y="150" width="265" height="125" rx="8" fill="#fff" stroke="#087f8c"/><text x="802.00" y="207.00" font-size="43" fill="#087f8c" text-anchor="middle" font-weight="400">−4</text><text x="802.00" y="247.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">gauge directions</text><text x="500.00" y="353.00" font-size="30" fill="#183746" text-anchor="middle" font-weight="400">4 physical phase-space functions</text><text x="500.00" y="410.00" font-size="25" fill="#b95730" text-anchor="middle" font-weight="400">= 2 configurations + 2 conjugate momenta</text></g></svg>
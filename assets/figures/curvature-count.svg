<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">From 256 slots to 20 independent entries</title><desc id="desc">A six-by-six matrix of antisymmetric index pairs has one triangular half highlighted, representing twenty-one symmetric entries before Bianchi. Riemann antisymmetry creates six pair labels; pair-exchange symmetry leaves 21 entries. The algebraic Bianchi identity removes one in four dimensions. This counts local tensor components, not propagating gravitational degrees of freedom.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">14 / FROM 256 SLOTS TO 20 INDEPENDENT ENTRIES</text><text x="45.00" y="95.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Two antisymmetric index pairs</text><text x="45.00" y="123.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">In four dimensions there are six possible independent pairs.</text><text x="140.00" y="159.00" font-size="15" fill="#526e7b" text-anchor="middle" font-weight="400">01</text><text x="103.00" y="195.00" font-size="15" fill="#526e7b" text-anchor="end" font-weight="400">01</text><rect x="122" y="171" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="164" y="171" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="206" y="171" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="248" y="171" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="290" y="171" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="332" y="171" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><text x="182.00" y="159.00" font-size="15" fill="#526e7b" text-anchor="middle" font-weight="400">02</text><text x="103.00" y="233.00" font-size="15" fill="#526e7b" text-anchor="end" font-weight="400">02</text><rect x="122" y="209" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="164" y="209" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="206" y="209" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="248" y="209" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="290" y="209" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="332" y="209" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><text x="224.00" y="159.00" font-size="15" fill="#526e7b" text-anchor="middle" font-weight="400">03</text><text x="103.00" y="271.00" font-size="15" fill="#526e7b" text-anchor="end" font-weight="400">03</text><rect x="122" y="247" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="164" y="247" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="206" y="247" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="248" y="247" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="290" y="247" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="332" y="247" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><text x="266.00" y="159.00" font-size="15" fill="#526e7b" text-anchor="middle" font-weight="400">12</text><text x="103.00" y="309.00" font-size="15" fill="#526e7b" text-anchor="end" font-weight="400">12</text><rect x="122" y="285" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="164" y="285" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="206" y="285" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="248" y="285" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="290" y="285" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="332" y="285" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><text x="308.00" y="159.00" font-size="15" fill="#526e7b" text-anchor="middle" font-weight="400">13</text><text x="103.00" y="347.00" font-size="15" fill="#526e7b" text-anchor="end" font-weight="400">13</text><rect x="122" y="323" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="164" y="323" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="206" y="323" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="248" y="323" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="290" y="323" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><rect x="332" y="323" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><text x="350.00" y="159.00" font-size="15" fill="#526e7b" text-anchor="middle" font-weight="400">23</text><text x="103.00" y="385.00" font-size="15" fill="#526e7b" text-anchor="end" font-weight="400">23</text><rect x="122" y="361" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="164" y="361" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="206" y="361" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="248" y="361" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="290" y="361" width="36" height="32" rx="3" fill="#e8eef0" stroke="#d5e2e7"/><rect x="332" y="361" width="36" height="32" rx="3" fill="#c9e4e7" stroke="#d5e2e7"/><text x="515.00" y="175.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">A symmetric 6 × 6 pair matrix</text><text x="515.00" y="203.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">6 diagonal + 15 off-diagonal = 21</text><text x="515.00" y="275.00" font-size="23" fill="#b95730" text-anchor="start" font-weight="400">One algebraic Bianchi relation</text><path d="M650.00,300.00 L650.00,332.00" fill="none" stroke="#b95730" stroke-width="2" marker-end="url(#b95730)"/><text x="515.00" y="385.00" font-size="25" fill="#087f8c" text-anchor="start" font-weight="400">20 independent curvature components</text></g></svg>
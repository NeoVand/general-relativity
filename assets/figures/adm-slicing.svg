<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Lapse and shift separate two choices</title><desc id="desc">A diagonal coordinate-time step is decomposed into a normal step between slices and a tangential shift. Lapse controls normal proper-time separation; shift controls the tangential relabeling. Arrow lengths are schematic and do not represent an ordinary Euclidean decomposition of a Lorentzian norm.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">33 / LAPSE AND SHIFT SEPARATE TWO CHOICES</text><text x="45.00" y="90.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">A coordinate step between spatial slices</text><text x="45.00" y="118.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">The split is bookkeeping, not a preferred cosmic clock.</text><path d="M100.00,200.00 L730.00,200.00 L865.00,135.00 L235.00,135.00 L100.00,200.00" stroke="#526e7b" stroke-width="2" fill="#e9f0f3"/><text x="785.00" y="205.00" font-size="18" fill="#526e7b" text-anchor="start" font-weight="400">next slice</text><path d="M100.00,370.00 L730.00,370.00 L865.00,305.00 L235.00,305.00 L100.00,370.00" stroke="#526e7b" stroke-width="2" fill="#e9f0f3"/><text x="785.00" y="375.00" font-size="18" fill="#526e7b" text-anchor="start" font-weight="400">initial slice</text><path d="M325.00,335.00 L325.00,165.00" fill="none" stroke="#087f8c" stroke-width="4" marker-end="url(#087f8c)"/><path d="M325.00,165.00 L465.00,165.00" fill="none" stroke="#b95730" stroke-width="4" marker-end="url(#b95730)"/><path d="M325.00,335.00 L465.00,165.00" fill="none" stroke="#4267a1" stroke-width="3" marker-end="url(#4267a1)"/><circle cx="325.00" cy="335.00" r="5.00" stroke="#183746" fill="#183746" stroke-width="2"/><text x="220.00" y="270.00" font-size="19" fill="#087f8c" text-anchor="start" font-weight="400">lapse × normal</text><text x="390.00" y="145.00" font-size="20" fill="#b95730" text-anchor="middle" font-weight="400">shift</text><text x="480.00" y="270.00" font-size="20" fill="#4267a1" text-anchor="start" font-weight="400">coordinate-time step</text><text x="70.00" y="445.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Spatial metric γ: measurements within a slice. Extrinsic curvature K: how that slice sits in spacetime.</text></g></svg>
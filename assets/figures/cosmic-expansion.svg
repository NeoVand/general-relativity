<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Expansion is not the same as acceleration</title><desc id="desc">Radiation and dust scale factors grow with downward curvature; a positive cosmological-constant model grows exponentially. Each ideal flat model is normalized to a(1)=1. The exponential curve uses H=2/3 in these plot units; it does not begin with a finite-time big bang in this slicing. These are separate single-component universes.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-we
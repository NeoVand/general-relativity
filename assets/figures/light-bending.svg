<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">A ray samples more than the clock rate</title><desc id="desc">A light ray bends toward a mass relative to its straight incoming reference line; the impact parameter is marked. This is the shape from a first-order weak-field deflection profile, with its amplitude enlarged. The book derives why keeping only the clock term misses half the leading GR deflection.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">24 / A RAY SAMPLES MORE THAN THE CLOCK RATE</text><text x="50.00" y="90.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Both clock and spatial terms affect light</text><text x="50.00" y="118.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">A weak-field ray past a spherical mass; deflection exaggerated.</text><circle cx="490.00" cy="305.00" r="48.00" stroke="#b95730" fill="#f4e5db" stroke-width="2"/><text x="490.00" y="312.00" font-size="27" fill="#b95730" text-anchor="middle" font-weight="400">M</text><path d="M65.00,185.00 L930.00,185.00" fill="none" stroke="#526e7b" stroke-width="2" stroke-dasharray="6 5"/><path d="M70.00,190.58 L73.40,190.58 L76.80,190.59 L80.20,190.59 L83.60,190.60 L87.00,190.60 L90.40,190.61 L93.80,190.61 L97.20,190.62 L100.60,190.62 L104.00,190.63 L107.40,190.63 L110.80,190.64 L114.20,190.64 L117.60,190.65 L121.00,190.66 L124.40,190.66 L127.80,190.67 L131.20,190.67 L134.60,190.68 L138.00,190.69 L141.40,190.69 L144.80,190.70 L148.20,190.71 L151.60,190.71 L155.00,190.72 L158.40,190.73 L161.80,190.73 L165.20,190.74 L168.60,190.75 L172.00,190.76 L175.40,190.76 L178.80,190.77 L182.20,190.78 L185.60,190.79 L189.00,190.80 L192.40,190.81 L195.80,190.81 L199.20,190.82 L202.60,190.83 L206.00,190.84 L209.40,190.85 L212.80,190.86 L216.20,190.87 L219.60,190.88 L223.00,190.89 L226.40,190.90 L229.80,190.91 L233.20,190.93 L236.60,190.94 L240.00,190.95 L243.40,190.96 L246.80,190.97 L250.20,190.99 L253.60,191.00 L257.00,191.01 L260.40,191.03 L263.80,191.04 L267.20,191.06 L270.60,191.07 L274.00,191.09 L277.40,191.10 L280.80,191.12 L284.20,191.14 L287.60,191.15 L291.00,191.17 L294.40,191.19 L297.80,191.21 L301.20,191.23 L304.60,191.25 L308.00,191.27 L311.40,191.29 L314.80,191.31 L318.20,191.33 L321.60,191.36 L325.00,191.38 L328.40,191.41 L331.80,191.43 L335.20,191.46 L338.60,191.49 L342.00,191.52 L345.40,191.55 L348.80,191.58 L352.20,191.61 L355.60,191.64 L359.00,191.68 L362.40,191.71 L365.80,191.75 L369.20,191.79 L372.60,191.83 L376.00,191.87
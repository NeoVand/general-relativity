<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" width="1000" height="505" role="img" aria-labelledby="title desc"><title id="title">A horizon changes which way the future goes</title><desc id="desc">At four radii, future radial light cones tilt inward. The outward generator is vertical at the horizon and points toward smaller radius inside. The diagram uses regular ingoing coordinates, not singular Schwarzschild time. Cone slopes follow dr/dT = −1 and (r − rₛ)/(r + rₛ). T is a drawing coordinate, not a freely falling clock reading.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="505" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">29 / A HORIZON CHANGES WHICH WAY THE FUTURE GOES</text><text x="50.00" y="90.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Regular horizon coordinates</text><text x="50.00" y="118.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Ingoing Eddington–Finkelstein time, drawn with T = v − r and c = 1.</text><path d="M80.00,390.00 L920.00,390.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><path d="M80.00,390.00 L80.00,140.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><text x="920.00" y="425.00" font-size="18" fill="#526e7b" text-anchor="end" font-weight="400">radius r / rₛ</text><g transform="rotate(-90 40 265.0)"><text x="40.00" y="265.00" font-size="18" fill="#526e7b" text-anchor="middle" font-weight="400">T / rₛ</text></g><rect x="320" y="155" width="2" height="235" rx="0" fill="#b95730" stroke="#b95730"/><text x="335.00" y="178.00" font-size="18" fill="#b95730" text-anchor="start" font-weight="400">horizon r = rₛ</text><path d="M120.00,230.00 L200.00,345.00 L173.33,230.00 L120.00,230.00" stroke="#087f8c" stroke-width="2" fill="#dceeee"/><path d="M200.00,345.00 L120.00,230.00" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#087f8c)"/><path d="M200.00,345.00 L173.33,230.00" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#087f8c)"/><text x="200.00" y="420.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">0.5</text><path d="M240.00,230.00 L320.00,345.00 L320.00,230.00 L240.00,230.00" stroke="#087f8c" stroke-width="2" fill="#dceeee"/><path d="M320.00,345.00 L240.00,230.00" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#087f8c)"/><path d="M320.00,345.00 L320.00,230.00" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#087f8c)"/><text x="320.00" y="420.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">1</text><path d="M384.00,230.00 L464.00,345.00 L482.46,230.00 L384.00,230.00" stroke="#087f8c" stroke-width="2" fill="#dceeee"/><path d="M464.00,345.00 L384.00,230.00" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#087f8c)"/><path d="M464.00,345.00 L482.46,230.00" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#087f8c)"/><text x="464.00" y="420.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">1.6</text><path d="M648.00,230.00 L728.00,345.00 L764.76,230.00 L648.00,230.00" stroke="#087f8c" stroke-width="2" fill="#dceeee"/><path d="M728.00,345.00 L648.00,230.00" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#087f8c)"/><path d="M728.00,345.00 L764.76,230.00" fill="none" stroke="#087f8c" stroke-width="2" marker-end="url(#087f8c)"/><text x="728.00" y="420.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">2.7</text><text x="70.00" y="462.00" font-size="19" fill="#b95730" text-anchor="start" font-weight="400">Inside: every future light direction goes to smaller r.</text><text x="580.00" y="462.00" font-size="19" fill="#087f8c" text-anchor="start" font-weight="400">Outside: an outward ray can escape.</text></g></svg>
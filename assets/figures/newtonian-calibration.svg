<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Where the factor of eight comes from</title><desc id="desc">Geometry, the trace-reversed dust source, and Poisson’s equation combine to fix the coupling constant. The displayed component estimates assume weak, stationary fields and slow pressureless matter, with x⁰=ct. The matching is performed in the chapter with the full index conventions.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">19 / WHERE THE FACTOR OF EIGHT COMES FROM</text><text x="45.00" y="95.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">The Newtonian calibration</text><text x="45.00" y="123.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Use the trace-reversed equation for slowly moving dust.</text><text x="65.00" y="186.00" font-size="20" fill="#087f8c" text-anchor="start" font-weight="650">Geometry</text><rect x="205" y="155" width="390" height="63" rx="8" fill="#fff" stroke="#087f8c"/><text x="400.00" y="196.00" font-size="28" fill="#087f8c" text-anchor="middle" font-weight="400">R₀₀ ≈ ∇²Φ / c²</text><text x="65.00" y="271.00" font-size="20" fill="#b95730" text-anchor="start" font-weight="650">Matter</text><rect x="205" y="240" width="390" height="63" rx="8" fill="#fff" stroke="#b95730"/><text x="400.00" y="281.00" font-size="28" fill="#b95730" text-anchor="middle" font-weight="400">T₀₀ − ½Tg₀₀ ≈ ½ρc²</text><text x="65.00" y="356.00" font-size="20" fill="#4267a1" text-anchor="start" font-weight="650">Newton</text><rect x="205" y="325" width="390" height="63" rx="8" fill="#fff" stroke="#4267a1"/><text x="400.00" y="366.00" font-size="28" fill="#4267a1" text-anchor="middle" font-weight="400">∇²Φ = 4πGρ</text><path d="M625.00,252.00 L682.00,252.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><text x="800.00" y="225.00" font-size="20" fill="#526e7b" text-anchor="middle" font-weight="400">Match the two</text><text x="800.00" y="277.00" font-size="30" fill="#183746" text-anchor="middle" font-weight="400">κ = 8πG / c⁴</text><text x="500.00" y="449.00" font-size="18" fill="#526e7b" text-anchor="middle" font-weight="400">The 4π comes from spherical flux. The additional 2 compensates for the half-sized dust source.</text></g></svg>
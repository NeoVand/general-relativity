<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Two areas constrain one remnant</title><desc id="desc">Two equal initial Schwarzschild horizons are compared with a limiting final circle whose area equals their sum. The equality illustration is the bound’s limiting case, not an achievable merger prediction. Initial binding energy is neglected, and all holes are assumed nonspinning; Kerr horizons require a different area formula.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">37 / TWO AREAS CONSTRAIN ONE REMNANT</text><text x="45.00" y="95.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Area increase is a bound, not an efficiency prediction</text><text x="45.00" y="123.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">An ideal comparison of nonspinning black holes.</text><circle cx="160.00" cy="270.00" r="60.00" stroke="#087f8c" fill="#dceeee" stroke-width="2"/><text x="160.00" y="276.00" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="400">M</text><circle cx="350.00" cy="270.00" r="60.00" stroke="#087f8c" fill="#dceeee" stroke-width="2"/><text x="350.00" y="276.00" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="400">M</text><text x="255.00" y="278.00" font-size="30" fill="#183746" text-anchor="middle" font-weight="400">+</text><path d="M450.00,270.00 L595.00,270.00" fill="none" stroke="#526e7b" stroke-width="3" marker-end="url(#526e7b)"/><circle cx="740.00" cy="270.00" r="84.85" stroke="#b95730" fill="#f7e7dd" stroke-width="2"/><text x="740.00" y="276.00" font-size="27" fill="#b95730" text-anchor="middle" font-weight="400">√2 M</text><text x="250.00" y="382.00" font-size="22" fill="#087f8c" text-anchor="middle" font-weight="400">Initial area: 2A(M)</text><text x="740.00" y="397.00" font-size="18" fill="#b95730" text-anchor="middle" font-weight="400">Minimum final mass from area alone</text><text x="500.00" y="452.00" font-size="23" fill="#183746" text-anchor="middle" font-weight="400">Radiated fraction ≤ 1 − 1/√2 ≈ 29.3%, under these idealizations.</text></g></svg>
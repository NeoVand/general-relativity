<svg class="gr-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="ricci-weyl-title ricci-weyl-desc"><title id="ricci-weyl-title">Volume and shape ask different questions</title><desc id="ricci-weyl-desc">An initial circular section is compared with a smaller circle and with a stretched ellipse. These are exaggerated cross-sections of infinitesimal clouds, not exact finite volume-preserving motions. The trace controls initial volume acceleration for an initially comoving cloud; shear can later change the volume.</desc><style>.gr-figure [data-compact-only]{display:none}.gr-figure.is-compact [data-compact-only]{display:inline}.gr-figure text{font-family:Manrope,Arial,sans-serif}.gr-figure .math-geometry{color:var(--geometry,#007c78)}.gr-figure .math-curvature{color:var(--curvature,#7951bb)}.gr-figure .math-transport{color:var(--transport,#275dc5)}.gr-figure .math-matter{color:var(--matter,#a25e00)}.gr-figure .math-observer{color:var(--observer,#bb365d)}@media(prefers-color-scheme:dark){svg.gr-figure:not(.embedded){--ink:#ebedf0;--muted:#a8b0bf;--geometry:#64d9c9;--curvature:#bd9cff;--transport:#8bb5ff;--matter:#f3c16e;--observer:#ff99b4;--line:#343e4f;--paper:#141b29;--figure-bg:#192231;--figure-tint:#243549}}svg.gr-figure:not(.embedded){--math-riemann:#6340a7;--math-ricci:#7650ad;--math-scalar-curvature:#a13f78;--math-weyl:#9a368f;--math-einstein:#553398;--math-volume:#33754c;--math-connection:#275dc5;--math-velocity:#a93458;--math-density:#986000;--math-pressure:#a14c22;--math-action:#635283;--math-coframe:#25774d;--math-torsion:#346a9e}@media(prefers-color-scheme:dark){svg.gr-figure:not(.embedded){--math-riemann:#c3a7ff;--math-ricci:#bc9be9;--math-scalar-curvature:#eea3c9;--math-weyl:#e1a0df;--math-einstein:#bda8ee;--math-volume:#9ad7a6;--math-connection:#91b8ff;--math-velocity:#ffa6bf;--math-density:#f1c572;--math-pressure:#f1af8b;--math-action:#cab6ed;--math-coframe:#8fd9b3;--math-torsion:#92c3ec}}svg.gr-figure .math-detail-riemann{color:var(--math-riemann,#6340a7)}svg.gr-figure .math-detail-ricci{color:var(--math-ricci,#7650ad)}svg.gr-figure .math-detail-scalar-curvature{color:var(--math-scalar-curvature,#a13f78)}svg.gr-figure .math-detail-weyl{color:var(--math-weyl,#9a368f)}svg.gr-figure .math-detail-einstein{color:var(--math-einstein,#553398)}svg.gr-figure .math-detail-volume{color:var(--math-volume,#33754c)}svg.gr-figure .math-detail-connection{color:var(--math-connection,#275dc5)}svg.gr-figure .math-detail-velocity{color:var(--math-velocity,#a93458)}svg.gr-figure .math-detail-density{color:var(--math-density,#986000)}svg.gr-figure .math-detail-pressure{color:var(--math-pressure,#a14c22)}svg.gr-figure .math-detail-action{color:var(--math-action,#635283)}svg.gr-figure .math-detail-coframe{color:var(--math-coframe,#25774d)}svg.gr-figure .math-detail-torsion{color:var(--math-torsion,#346a9e)}</style><defs><marker id="ricci-weyl-183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink,#20262c)"/></marker><marker id="ricci-weyl-526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#626971)"/></marker><marker id="ricci-weyl-087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--geometry,#007c78)"/></marker><marker id="ricci-weyl-b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--observer,#bb365d)"/></marker><marker id="ricci-weyl-4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--transport,#275dc5)"/></marker><marker id="ricci-weyl-b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--matter,#a25e00)"/></marker><marker id="ricci-weyl-d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line,#d9dddf)"/></marker></defs><rect width="1000" height="480" fill="var(--figure-bg,#f3f4f2)"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="var(--muted,#626971)" text-anchor="start" font-weight="650">15 / VOLUME AND SHAPE ASK DIFFERENT QUESTIONS</text><text x="50.00" y="100.00" font-size="22" fill="var(--geometry,#007c78)" text-anchor="start" font-weight="650">Isotropic initial squeeze</text><text x="50.00" y="128.00" font-size="17" fill="var(--muted,#626971)" text-anchor="start" font-weight="400">The trace is nonzero.</text><text x="555.00" y="100.00" font-size="22" fill="var(--geometry,#007c78)" text-anchor="start" font-weight="650">Trace-free initial distortion</text><text x="555.00" y="128.00" font-size="17" fill="var(--muted,#626971)" text-anchor="start" font-weight="400">Stretch one way; squeeze another.</text><circle cx="230.00" cy="280.00" r="95.00" stroke="var(--muted,#626971)" fill="none" stroke-width="2"/><circle cx="745.00" cy="280.00" r="95.00" stroke="var(--muted,#626971)" fill="none" stroke-width="2"/><circle cx="230.00" cy="280.00" r="72.00" stroke="var(--geometry,#007c78)" fill="var(--figure-tint,#e6ece9)" stroke-width="2"/><ellipse cx="745" cy="280" rx="120" ry="70" fill="var(--figure-tint,#e6ece9)" stroke="var(--observer,#bb365d)" stroke-width="3" stroke-dasharray=""/><text x="230.00" y="420.00" font-size="20" fill="var(--geometry,#007c78)" text-anchor="middle" font-weight="400">Volume acceleration is negative</text><text x="745.00" y="420.00" font-size="20" fill="var(--observer,#bb365d)" text-anchor="middle" font-weight="400">Initial volume acceleration can be zero</text></g></svg>
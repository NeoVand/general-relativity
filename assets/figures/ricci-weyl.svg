<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Volume and shape ask different questions</title><desc id="desc">An initial circular section is compared with a smaller circle and with a stretched ellipse. These are exaggerated cross-sections of infinitesimal clouds, not exact finite volume-preserving motions. The trace controls initial volume acceleration for an initially comoving cloud; shear can later change the volume.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">15 / VOLUME AND SHAPE ASK DIFFERENT QUESTIONS</text><text x="50.00" y="100.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Isotropic initial squeeze</text><text x="50.00" y="128.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">The trace is nonzero.</text><text x="555.00" y="100.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Trace-free initial distortion</text><text x="555.00" y="128.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Stretch one way; squeeze another.</text><circle cx="230.00" cy="280.00" r="95.00" stroke="#526e7b" fill="none" stroke-width="2"/><circle cx="745.00" cy="280.00" r="95.00" stroke="#526e7b" fill="none" stroke-width="2"/><circle cx="230.00" cy="280.00" r="72.00" stroke="#087f8c" fill="#e3f0f0" stroke-width="2"/><ellipse cx="745" cy="280" rx="120" ry="70" fill="#f8ebe4" stroke="#b95730" stroke-width="3" stroke-dasharray=""/><text x="230.00" y="420.00" font-size="20" fill="#087f8c" text-anchor="middle" font-weight="400">Volume acceleration is negative</text><text x="745.00" y="420.00" font-size="20" fill="#b95730" text-anchor="middle" font-weight="400">Initial volume acceleration can be zero</text></g></svg>
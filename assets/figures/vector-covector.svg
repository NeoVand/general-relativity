<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Arrows and the questions they answer</title><desc id="desc">A diagonal vector crosses three evenly spaced level intervals of the function x. The covector dx returns the change in x, not the Euclidean length of the arrow. Changing the coordinate scale changes both components so their pairing stays the same.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">04 / ARROWS AND THE QUESTIONS THEY ANSWER</text><text x="50.00" y="90.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">A vector supplies a displacement</text><text x="50.00" y="118.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">v = (3, 2)</text><text x="545.00" y="90.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">A covector asks a linear question</text><text x="545.00" y="118.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">ω = dx, so ω(v) = 3</text><path d="M90.00,360.00 L430.00,360.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><path d="M90.00,360.00 L90.00,150.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><text x="430.00" y="395.00" font-size="18" fill="#526e7b" text-anchor="end" font-weight="400">x</text><g transform="rotate(-90 50 255.0)"><text x="50.00" y="255.00" font-size="18" fill="#526e7b" text-anchor="middle" font-weight="400">y</text></g><path d="M90.00,345.00 L90.00,160.00" fill="none" stroke="#d5e2e7" stroke-width="2"/><text x="90.00" y="387.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">0</text><path d="M160.00,345.00 L160.00,160.00" fill="none" stroke="#d5e2e7" stroke-width="2"/><text x="160.00" y="387.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">1</text><path d="M230.00,345.00 L230.00,160.00" fill="none" stroke="#d5e2e7" stroke-width="2"/><text x="230.00" y="387.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">2</text><path d="M300.00,345.00 L300.00,160.00" fill="none" stroke="#d5e2e7" stroke-width="2"/><text x="300.00" y="387.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">3</text><path d="M370.00,345.00 L370.00,160.00" fill="none" stroke="#d5e2e7" stroke-width="2"/><text x="370.00" y="387.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">4</text><path d="M90.00,360.00 L300.00,220.00" fill="none" stroke="#087f8c" stroke-width="4" marker-end="url(#087f8c)"/><text x="280.00" y="200.00" font-size="27" fill="#087f8c" text-anchor="start" font-weight="400">v</text><path d="M90.00,360.00 L300.00,360.00" fill="none" stroke="#b95730" stroke-width="4" marker-end="url(#b95730)"/><path d="M590.00,365.00 L590.00,170.00" fill="none" stroke="#4267a1" stroke-width="2"/><text x="590.00" y="396.00" font-size="16" fill="#526e7b" text-anchor="middle" font-weight="400">x = 0</text><path d="M660.00,365.00 L660.00,170.00" fill="none" stroke="#4267a1" stroke-width="2"/><text x="660.00" y="396.00" font-size="16" fill="#526e7b" text-anchor="middle" font-weight="400">x = 1</text><path d="M730.00,365.00 L730.00,170.00" fill="none" stroke="#4267a1" stroke-width="2"/><text x="730.00" y="396.00" font-size="16" fill="#526e7b" text-anchor="middle" font-weight="400">x = 2</text><path d="M800.00,365.00 L800.00,170.00" fill="none" stroke="#4267a1" stroke-width="2"/><text x="800.00" y="396.00" font-size="16" fill="#526e7b" text-anchor="middle" font-weight="400">x = 3</text><path d="M870.00,365.00 L870.00,170.00" fill="none" stroke="#4267a1" stroke-width="2"/><text x="870.00" y="396.00" font-size="16" fill="#526e7b" text-anchor="middle" font-weight="400">x = 4</text><path d="M590.00,360.00 L800.00,220.00" fill="none" stroke="#087f8c" stroke-width="4" marker-end="url(#087f8c)"/><text x="625.00" y="435.00" font-size="18" fill="#087f8c" text-anchor="start" font-weight="400">Three level intervals crossed → answer 3</text></g></svg>
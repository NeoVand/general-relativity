<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Focusing is not yet a singularity</title><desc id="desc">Five straight timelike paths converge to a caustic, alongside the focusing time bound. This flat-spacetime schematic intentionally has no curvature. Raychaudhuri can force a congruence to focus, but singularity theorems require additional causal and global assumptions to conclude geodesic incompleteness.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">36 / FOCUSING IS NOT YET A SINGULARITY</text><path d="M80.00,385.00 L480.00,385.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><path d="M80.00,385.00 L80.00,135.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><text x="480.00" y="420.00" font-size="18" fill="#526e7b" text-anchor="end" font-weight="400">position</text><g transform="rotate(-90 40 260.0)"><text x="40.00" y="260.00" font-size="18" fill="#526e7b" text-anchor="middle" font-weight="400">affine time</text></g><path d="M140.00,365.00 L270.00,165.00" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M205.00,365.00 L270.00,165.00" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M270.00,365.00 L270.00,165.00" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M335.00,365.00 L270.00,165.00" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M400.00,365.00 L270.00,165.00" fill="none" stroke="#087f8c" stroke-width="3"/><circle cx="270.00" cy="165.00" r="7.00" stroke="#b95730" fill="#b95730" stroke-width="2"/><text x="300.00" y="150.00" font-size="21" fill="#b95730" text-anchor="start" font-weight="400">caustic</text><text x="565.00" y="140.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Convergence can have a deadline</text><text x="565.00" y="168.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">If θ₀ &lt; 0 and dθ/dτ ≤ −θ²/3,</text><text x="565.00" y="233.00" font-size="31" fill="#087f8c" text-anchor="start" font-weight="400">τfocus ≤ 3 / |θ₀|</text><text x="565.00" y="297.00" font-size="17" fill="#183746" text-anchor="start" font-weight="400">But straight lines can cross in flat spacetime.</text><text x="565.00" y="345.00" font-size="24" fill="#b95730" text-anchor="start" font-weight="400">Caustic ≠ singular spacetime</text><text x="565.00" y="390.00" font-size="18" fill="#526e7b" text-anchor="start" font-weight="400">Global hypotheses do the extra work.</text></g></svg>
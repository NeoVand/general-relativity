<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Same method, different curvature</title><desc id="desc">Side-by-side coframe, connection, and curvature formulas compare the polar plane with the sphere. These are local formulas on regular angular charts. The polar origin and sphere poles need other frames; a singular coordinate expression there is not an extra curvature singularity.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">35 / SAME METHOD, DIFFERENT CURVATURE</text><text x="45.00" y="95.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Coordinates versus local physical components</text><text x="45.00" y="123.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">A coframe converts coordinate changes into ruler readings.</text><rect x="55" y="145" width="395" height="255" rx="8" fill="#fff" stroke="#087f8c"/><text x="252.00" y="184.00" font-size="24" fill="#087f8c" text-anchor="middle" font-weight="650">Flat polar plane</text><text x="90.00" y="232.00" font-size="25" fill="#183746" text-anchor="start" font-weight="400">e¹ = dr</text><text x="90.00" y="275.00" font-size="25" fill="#183746" text-anchor="start" font-weight="400">e² = r dθ</text><text x="90.00" y="318.00" font-size="25" fill="#183746" text-anchor="start" font-weight="400">ω¹₂ = −dθ</text><text x="90.00" y="361.00" font-size="25" fill="#087f8c" text-anchor="start" font-weight="400">Ω¹₂ = 0</text><rect x="550" y="145" width="395" height="255" rx="8" fill="#fff" stroke="#b95730"/><text x="747.00" y="184.00" font-size="24" fill="#b95730" text-anchor="middle" font-weight="650">Round sphere of radius a</text><text x="585.00" y="232.00" font-size="25" fill="#183746" text-anchor="start" font-weight="400">e¹ = a dθ</text><text x="585.00" y="275.00" font-size="25" fill="#183746" text-anchor="start" font-weight="400">e² = a sinθ dφ</text><text x="585.00" y="318.00" font-size="25" fill="#183746" text-anchor="start" font-weight="400">ω¹₂ = −cosθ dφ</text><text x="585.00" y="361.00" font-size="25" fill="#b95730" text-anchor="start" font-weight="400">Ω¹₂ = e¹ ∧ e² / a²</text><text x="500.00" y="449.00" font-size="18" fill="#526e7b" text-anchor="middle" font-weight="400">A nonzero connection occurs in both. A nonzero curvature two-form distinguishes the sphere.</text></g></svg>
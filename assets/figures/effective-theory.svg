<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">A theory has a resolution scale</title><desc id="desc">A scale axis progresses from long wavelengths with controlled corrections toward a cutoff with no small expansion parameter. This is a hierarchy diagram, not a measured error curve. The cutoff depends on the theory and physical setting; the text distinguishes gravitational scales from other possible new-physics scales.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">39 / A THEORY HAS A RESOLUTION SCALE</text><text x="45.00" y="95.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Ask a theory questions at the scale it resolves</text><text x="45.00" y="123.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">The expansion parameter is energy / cutoff, or microscopic length / wavelength.</text><path d="M100.00,260.00 L900.00,260.00" fill="none" stroke="#183746" stroke-width="3" marker-end="url(#183746)"/><path d="M150.00,250.00 L150.00,270.00" fill="none" stroke="#087f8c" stroke-width="3"/><text x="150.00" y="307.00" font-size="20" fill="#087f8c" text-anchor="middle" font-weight="400">long wavelength</text><path d="M485.00,250.00 L485.00,270.00" fill="none" stroke="#4267a1" stroke-width="3"/><text x="485.00" y="307.00" font-size="20" fill="#4267a1" text-anchor="middle" font-weight="400">shorter wavelength</text><path d="M815.00,250.00 L815.00,270.00" fill="none" stroke="#b95730" stroke-width="3"/><text x="815.00" y="307.00" font-size="20" fill="#b95730" text-anchor="middle" font-weight="400">near the cutoff</text><text x="180.00" y="202.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="400">controlled corrections</text><text x="680.00" y="202.00" font-size="22" fill="#b95730" text-anchor="start" font-weight="400">no small parameter</text><text x="500.00" y="380.00" font-size="29" fill="#183746" text-anchor="middle" font-weight="400">Leading theory + smaller terms + smaller terms + …</text><text x="500.00" y="432.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">The coefficients encode unresolved physics; the ordering makes low-energy calculations useful.</text></g></svg>
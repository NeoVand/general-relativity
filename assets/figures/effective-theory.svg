<svg class="gr-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="effective-theory-title effective-theory-desc"><title id="effective-theory-title">A theory has a resolution scale</title><desc id="effective-theory-desc">A scale axis progresses from long wavelengths with controlled corrections toward a cutoff with no small expansion parameter. This is a hierarchy diagram, not a measured error curve. The cutoff depends on the theory and physical setting; the text distinguishes gravitational scales from other possible new-physics scales.</desc><style>.gr-figure text{font-family:Manrope,Arial,sans-serif}.gr-figure .math-geometry{color:var(--geometry,#007c78)}.gr-figure .math-curvature{color:var(--curvature,#7951bb)}.gr-figure .math-transport{color:var(--transport,#275dc5)}.gr-figure .math-matter{color:var(--matter,#a25e00)}.gr-figure .math-observer{color:var(--observer,#bb365d)}@media(prefers-color-scheme:dark){svg.gr-figure:not(.embedded){--ink:#ebedf0;--muted:#a8b0bf;--geometry:#64d9c9;--curvature:#bd9cff;--transport:#8bb5ff;--matter:#f3c16e;--observer:#ff99b4;--line:#343e4f;--paper:#141b29;--figure-bg:#192231;--figure-tint:#243549}}</style><defs><marker id="effective-theory-183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink,#20262c)"/></marker><marker id="effective-theory-526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#626971)"/></marker><marker id="effective-theory-087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--geometry,#007c78)"/></marker><marker id="effective-theory-b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--observer,#bb365d)"/></marker><marker id="effective-theory-4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--transport,#275dc5)"/></marker><marker id="effective-theory-b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--matter,#a25e00)"/></marker><marker id="effective-theory-d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line,#d9dddf)"/></marker></defs><rect width="1000" height="480" fill="var(--figure-bg,#f3f4f2)"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="var(--muted,#626971)" text-anchor="start" font-weight="650">39 / A THEORY HAS A RESOLUTION SCALE</text><text x="45.00" y="95.00" font-size="22" fill="var(--geometry,#007c78)" text-anchor="start" font-weight="650">Ask a theory questions at the scale it resolves</text><text x="45.00" y="123.00" font-size="17" fill="var(--muted,#626971)" text-anchor="start" font-weight="400">The expansion parameter is energy / cutoff, or microscopic length / wavelength.</text><path d="M100.00,260.00 L900.00,260.00" fill="none" stroke="var(--ink,#20262c)" stroke-width="3" marker-end="url(#effective-theory-183746)"/><path d="M150.00,250.00 L150.00,270.00" fill="none" stroke="var(--geometry,#007c78)" stroke-width="3"/><text x="150.00" y="307.00" font-size="20" fill="var(--geometry,#007c78)" text-anchor="middle" font-weight="400">long wavelength</text><path d="M485.00,250.00 L485.00,270.00" fill="none" stroke="var(--transport,#275dc5)" stroke-width="3"/><text x="485.00" y="307.00" font-size="20" fill="var(--transport,#275dc5)" text-anchor="middle" font-weight="400">shorter wavelength</text><path d="M815.00,250.00 L815.00,270.00" fill="none" stroke="var(--observer,#bb365d)" stroke-width="3"/><text x="815.00" y="307.00" font-size="20" fill="var(--observer,#bb365d)" text-anchor="middle" font-weight="400">near the cutoff</text><text x="180.00" y="202.00" font-size="22" fill="var(--geometry,#007c78)" text-anchor="start" font-weight="400">controlled corrections</text><text x="680.00" y="202.00" font-size="22" fill="var(--observer,#bb365d)" text-anchor="start" font-weight="400">no small parameter</text><text x="500.00" y="380.00" font-size="29" fill="var(--ink,#20262c)" text-anchor="middle" font-weight="400">Leading theory + smaller terms + smaller terms + …</text><text x="500.00" y="432.00" font-size="17" fill="var(--muted,#626971)" text-anchor="middle" font-weight="400">The coefficients encode unresolved physics; the ordering makes low-energy calculations useful.</text></g></svg>
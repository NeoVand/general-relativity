<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">The minus sign creates a light cone</title><desc id="desc">Two light rays bound the possible future of an event. A slower-than-light path lies inside, and a spacelike displacement lies outside. The graph uses the same scale for x and ct. A massive observer follows a timelike worldline; no rest frame exists for a light ray.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">05 / THE MINUS SIGN CREATES A LIGHT CONE</text><path d="M460.00,390.00 L890.00,390.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><path d="M460.00,390.00 L460.00,100.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><text x="890.00" y="425.00" font-size="18" fill="#526e7b" text-anchor="end" font-weight="400">space x</text><g transform="rotate(-90 420 245.0)"><text x="420.00" y="245.00" font-size="18" fill="#526e7b" text-anchor="middle" font-weight="400">time ct</text></g><path d="M180.00,110.00 L460.00,390.00 L740.00,110.00" stroke="#087f8c" stroke-width="2" fill="#dff0f0"/><path d="M180.00,110.00 L460.00,390.00" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M460.00,390.00 L740.00,110.00" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M460.00,390.00 L535.00,155.00" fill="none" stroke="#b95730" stroke-width="4" marker-end="url(#b95730)"/><text x="570.00" y="180.00" font-size="21" fill="#b95730" text-anchor="start" font-weight="400">timelike</text><path d="M460.00,390.00 L830.00,300.00" fill="none" stroke="#4267a1" stroke-width="3" marker-end="url(#4267a1)"/><text x="720.00" y="280.00" font-size="21" fill="#4267a1" text-anchor="start" font-weight="400">spacelike</text><text x="460.00" y="92.00" font-size="16" fill="#087f8c" text-anchor="middle" font-weight="650">FUTURE LIGHT CONE</text><text x="194.00" y="250.00" font-size="18" fill="#087f8c" text-anchor="start" font-weight="400">light: |Δx| = cΔt</text><text x="52.00" y="443.00" font-size="18" fill="#526e7b" text-anchor="start" font-weight="400">Signals from the starting event remain on or inside this cone. One space dimension is shown.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" width="1000" height="505" role="img" aria-labelledby="title desc"><title id="title">Why a determinant belongs in the volume</title><desc id="desc">A square transforms into a parallelogram under a linear map; the absolute determinant is its area scaling. This Euclidean two-dimensional example explains the square root of the metric determinant. In four-dimensional Lorentzian geometry the positive measure uses √(−g). The drawn transformation is illustrative.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="505" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">08 / WHY A DETERMINANT BELONGS IN THE VOLUME</text><text x="45.00" y="95.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">The determinant measures area scaling</text><text x="45.00" y="123.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">A unit coordinate square maps to a parallelogram.</text><path d="M85.00,370.00 L415.00,370.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><path d="M85.00,370.00 L85.00,155.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><text x="415.00" y="405.00" font-size="18" fill="#526e7b" text-anchor="end" font-weight="400">x</text><g transform="rotate(-90 45 262.5)"><text x="45.00" y="262.50" font-size="18" fill="#526e7b" text-anchor="middle" font-weight="400">y</text></g><path d="M125.00,330.00 L265.00,330.00 L265.00,190.00 L125.00,190.00 L125.00,330.00" stroke="#087f8c" stroke-width="3" fill="#dceeee"/><path d="M430.00,270.00 L535.00,270.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><path d="M610.00,350.00 L840.00,350.00 L910.00,180.00 L680.00,180.00 L610.00,350.00" stroke="#b95730" stroke-width="3" fill="#f7e7dd"/><text x="195.00" y="410.00" font-size="20" fill="#087f8c" text-anchor="middle" font-weight="400">coordinate area = 1</text><text x="760.00" y="410.00" font-size="20" fill="#b95730" text-anchor="middle" font-weight="400">physical area = |det A|</text><text x="500.00" y="465.00" font-size="23" fill="#183746" text-anchor="middle" font-weight="400">For a Euclidean Gram metric g = AᵀA, √det g = |det A|.</text></g></svg>
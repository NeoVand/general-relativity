<svg class="gr-figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="moving-basis-title moving-basis-desc"><title id="moving-basis-title">Different components can describe the same arrow</title><desc id="moving-basis-desc">At three points on a circle the eastward vector stays horizontal while radial and angular basis directions rotate. The ordinary component derivatives see changing numbers. The connection correction accounts for the basis change. Together they report that this field is constant.</desc><style>.gr-figure text{font-family:Manrope,Arial,sans-serif}.gr-figure .math-geometry{color:var(--geometry,#007c78)}.gr-figure .math-curvature{color:var(--curvature,#7951bb)}.gr-figure .math-transport{color:var(--transport,#275dc5)}.gr-figure .math-matter{color:var(--matter,#a25e00)}.gr-figure .math-observer{color:var(--observer,#bb365d)}@media(prefers-color-scheme:dark){svg.gr-figure:not(.embedded){--ink:#ebedf0;--muted:#a8b0bf;--geometry:#64d9c9;--curvature:#bd9cff;--transport:#8bb5ff;--matter:#f3c16e;--observer:#ff99b4;--line:#343e4f;--paper:#141b29;--figure-bg:#192231;--figure-tint:#243549}}</style><defs><marker id="moving-basis-183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink,#20262c)"/></marker><marker id="moving-basis-526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#626971)"/></marker><marker id="moving-basis-087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--geometry,#007c78)"/></marker><marker id="moving-basis-b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--observer,#bb365d)"/></marker><marker id="moving-basis-4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--transport,#275dc5)"/></marker><marker id="moving-basis-b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--matter,#a25e00)"/></marker><marker id="moving-basis-d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line,#d9dddf)"/></marker></defs><rect width="1000" height="480" fill="var(--figure-bg,#f3f4f2)"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="var(--muted,#626971)" text-anchor="start" font-weight="650">11 / DIFFERENT COMPONENTS CAN DESCRIBE THE SAME ARROW</text><text x="45.00" y="90.00" font-size="22" fill="var(--geometry,#007c78)" text-anchor="start" font-weight="650">Same arrow. Changing local basis.</text><text x="45.00" y="118.00" font-size="17" fill="var(--muted,#626971)" text-anchor="start" font-weight="400">Each teal arrow points east in the same flat plane.</text><path d="M100.00,360.00 L800.00,360.00" fill="none" stroke="var(--line,#d9dddf)" stroke-width="2"/><path d="M370.00,410.00 L370.00,140.00" fill="none" stroke="var(--line,#d9dddf)" stroke-width="2"/><path d="M370.00,360.00 L560.32,271.25" fill="none" stroke="var(--line,#d9dddf)" stroke-width="2" stroke-dasharray="5 5"/><circle cx="560.32" cy="271.25" r="4.00" stroke="var(--ink,#20262c)" fill="var(--ink,#20262c)" stroke-width="2"/><path d="M560.32,271.25 L655.32,271.25" fill="none" stroke="var(--geometry,#007c78)" stroke-width="4" marker-end="url(#moving-basis-087f8c)"/><path d="M560.32,271.25 L614.70,245.89" fill="none" stroke="var(--observer,#bb365d)" stroke-width="2" marker-end="url(#moving-basis-b95730)"/><path d="M560.32,271.25 L540.04,227.75" fill="none" stroke="var(--transport,#275dc5)" stroke-width="2" marker-end="url(#moving-basis-4267a1)"/><path d="M370.00,360.00 L458.75,169.68" fill="none" stroke="var(--line,#d9dddf)" stroke-width="2" stroke-dasharray="5 5"/><circle cx="458.75" cy="169.68" r="4.00" stroke="var(--ink,#20262c)" fill="var(--ink,#20262c)" stroke-width="2"/><path d="M458.75,169.68 L553.75,169.68" fill="none" stroke="var(--geometry,#007c78)" stroke-width="4" marker-end="url(#moving-basis-087f8c)"/><path d="M458.75,169.68 L484.11,115.30" fill="none" stroke="var(--observer,#bb365d)" stroke-width="2" marker-end="url(#moving-basis-b95730)"/><path d="M458.75,169.68 L415.25,149.39" fill="none" stroke="var(--transport,#275dc5)" stroke-width="2" marker-end="url(#moving-basis-4267a1)"/><path d="M370.00,360.00 L249.55,187.98" fill="none" stroke="var(--line,#d9dddf)" stroke-width="2" stroke-dasharray="5 5"/><circle cx="249.55" cy="187.98" r="4.00" stroke="var(--ink,#20262c)" fill="var(--ink,#20262c)" stroke-width="2"/><path d="M249.55,187.98 L344.55,187.98" fill="none" stroke="var(--geometry,#007c78)" stroke-width="4" marker-end="url(#moving-basis-087f8c)"/><path d="M249.55,187.98 L215.13,138.83" fill="none" stroke="var(--observer,#bb365d)" stroke-width="2" marker-end="url(#moving-basis-b95730)"/><path d="M249.55,187.98 L210.23,215.51" fill="none" stroke="var(--transport,#275dc5)" stroke-width="2" marker-end="url(#moving-basis-4267a1)"/><text x="690.00" y="140.00" font-size="21" fill="var(--geometry,#007c78)" text-anchor="start" font-weight="400">eastward field</text><text x="690.00" y="183.00" font-size="21" fill="var(--observer,#bb365d)" text-anchor="start" font-weight="400">radial direction</text><text x="690.00" y="226.00" font-size="21" fill="var(--transport,#275dc5)" text-anchor="start" font-weight="400">angular direction</text><text x="180.00" y="443.00" font-size="23" fill="var(--ink,#20262c)" text-anchor="start" font-weight="400">Component change + basis change = zero geometric change</text></g></svg>
" fill="#b95730" text-anchor="start" font-weight="650">GPS altitude ≈ 20,200 km</text><text x="655.00" y="173.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Net: about +38.5 μs per day.</text><text x="655.00" y="255.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Crossover at h = R / 2</text><text x="655.00" y="283.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">About 3,186 km above the surface.</text><text x="655.00" y="349.00" font-size="19" fill="#183746" text-anchor="start" font-weight="400">Above: orbital clock gains time.</text><text x="655.00" y="387.00" font-size="19" fill="#183746" text-anchor="start" font-weight="400">Below: orbital clock loses time.</text></g></svg>
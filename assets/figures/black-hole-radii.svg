<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Do not merge these three radii</title><desc id="desc">Three concentric circles have coordinate radii in the ratio two to three to six. Circle radii are proportional to the Schwarzschild areal coordinate r. The drawing is a radial coordinate guide, not an isometric picture of spatial proper distances.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">28 / DO NOT MERGE THESE THREE RADII</text><text x="45.00" y="90.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Three radii, three questions</text><text x="45.00" y="118.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">For a nonrotating, uncharged black hole.</text><circle cx="320.00" cy="290.00" r="170.00" stroke="#4267a1" fill="none" stroke-width="2"/><circle cx="320.00" cy="290.00" r="85.00" stroke="#b18225" fill="none" stroke-width="2"/><circle cx="320.00" cy="290.00" r="56.67" stroke="#087f8c" fill="none" stroke-width="2"/><circle cx="320.00" cy="290.00" r="4.00" stroke="#183746" fill="#183746" stroke-width="2"/><text x="565.00" y="170.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">Horizon · 2GM/c²</text><text x="565.00" y="198.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Boundary of causal escape</text><text x="565.00" y="265.00" font-size="22" fill="#b18225" text-anchor="start" font-weight="650">Photon sphere · 3GM/c²</text><text x="565.00" y="293.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Unstable circular light orbits</text><text x="565.00" y="360.00" font-size="22" fill="#4267a1" text-anchor="start" font-weight="650">ISCO · 6GM/c²</text><text x="565.00" y="388.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Innermost stable circular timelike orbit</text></g></svg>
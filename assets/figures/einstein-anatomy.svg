<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Read the equation as a relationship</title><desc id="desc">The Einstein tensor and vacuum term stand opposite the coupled stress-energy tensor. The equation constrains spacetime geometry and matter together. It is not a recipe that chooses arbitrary matter independently of its own dynamics and conservation.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">18 / READ THE EQUATION AS A RELATIONSHIP</text><text x="50.00" y="100.00" font-size="22" fill="#087f8c" text-anchor="start" font-weight="650">A local equation at every event</text><text x="50.00" y="128.00" font-size="17" fill="#526e7b" text-anchor="start" font-weight="400">Ten symmetric component equations, tied together by identities and constraints.</text><rect x="50" y="155" width="280" height="155" rx="8" fill="#fff" stroke="#087f8c"/><text x="190.00" y="213.00" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="650">Einstein tensor</text><text x="190.00" y="260.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">Ricci − ½ trace × metric</text><rect x="360" y="155" width="230" height="155" rx="8" fill="#fff" stroke="#b18225"/><text x="475.00" y="213.00" font-size="25" fill="#b18225" text-anchor="middle" font-weight="650">Vacuum term</text><text x="475.00" y="260.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">Λ × metric</text><rect x="640" y="155" width="310" height="155" rx="8" fill="#fff" stroke="#b95730"/><text x="795.00" y="213.00" font-size="25" fill="#b95730" text-anchor="middle" font-weight="650">Matter &amp; energy</text><text x="795.00" y="260.00" font-size="17" fill="#526e7b" text-anchor="middle" font-weight="400">(8πG/c⁴) × stress-energy</text><text x="345.00" y="243.00" font-size="30" fill="#183746" text-anchor="middle" font-weight="400">+</text><text x="615.00" y="243.00" font-size="30" fill="#183746" text-anchor="middle" font-weight="400">=</text><text x="195.00" y="377.00" font-size="20" fill="#087f8c" text-anchor="middle" font-weight="400">Geometric response</text><text x="795.00" y="377.00" font-size="20" fill="#b95730" text-anchor="middle" font-weight="400">Physical source</text><path d="M320.00,366.00 L630.00,366.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><text x="500.00" y="442.00" font-size="19" fill="#526e7b" text-anchor="middle" font-weight="400">Each term is a tensor. A single component depends on the chosen frame.</text></g></svg>
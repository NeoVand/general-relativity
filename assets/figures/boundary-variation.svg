<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc"><title id="title">Fixing the value does not fix the slope</title><desc id="desc">A variation vanishes at both endpoints while having nonzero slopes there. The scalar graph is an analogy for each metric variation component along a normal direction. It explains why the Einstein–Hilbert action needs appropriate boundary treatment even when the boundary metric is fixed.</desc><defs><marker id="183746" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183746"/></marker><marker id="526e7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526e7b"/></marker><marker id="087f8c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="b95730" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b95730"/></marker><marker id="4267a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4267a1"/></marker><marker id="b18225" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b18225"/></marker><marker id="d5e2e7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e2e7"/></marker></defs><rect width="1000" height="480" fill="#f6f9fa"/><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><text x="36.00" y="37.00" font-size="14" fill="#526e7b" text-anchor="start" font-weight="650">22 / FIXING THE VALUE DOES NOT FIX THE SLOPE</text><path d="M80.00,370.00 L500.00,370.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><path d="M80.00,370.00 L80.00,130.00" fill="none" stroke="#526e7b" stroke-width="2" marker-end="url(#526e7b)"/><text x="500.00" y="405.00" font-size="18" fill="#526e7b" text-anchor="end" font-weight="400">coordinate normal to boundary</text><g transform="rotate(-90 40 250.0)"><text x="40.00" y="250.00" font-size="18" fill="#526e7b" text-anchor="middle" font-weight="400">allowed variation</text></g><path d="M105.00,370.00 L107.37,365.14 L109.73,360.35 L112.10,355.63 L114.47,350.97 L116.83,346.37 L119.20,341.84 L121.57,337.37 L123.93,332.97 L126.30,328.64 L128.67,324.37 L131.03,320.17 L133.40,316.03 L135.77,311.95 L138.13,307.94 L140.50,304.00 L142.87,300.12 L145.23,296.31 L147.60,292.56 L149.97,288.88 L152.33,285.26 L154.70,281.71 L157.07,278.22 L159.43,274.80 L161.80,271.44 L164.17,268.15 L166.53,264.92 L168.90,261.76 L171.27,258.66 L173.63,255.63 L176.00,252.67 L178.37,249.77 L180.73,246.93 L183.10,244.16 L185.47,241.45 L187.83,238.81 L190.20,236.24 L192.57,233.73 L194.93,231.29 L197.30,228.91 L199.67,226.59 L202.03,224.34 L204.40,222.16 L206.77,220.04 L209.13,217.99 L211.50,216.00 L213.87,214.08 L216.23,212.22 L218.60,210.43 L220.97,208.70 L223.33,207.04 L225.70,205.44 L228.07,203.91 L230.43,202.44 L232.80,201.04 L235.17,199.70 L237.53,198.43 L239.90,197.23 L242.27,196.09 L244.63,195.01 L247.00,194.00 L249.37,193.05 L251.73,192.17 L254.10,191.36 L256.47,190.61 L258.83,189.93 L261.20,189.31 L263.57,188.75 L265.93,188.26 L268.30,187.84 L270.67,187.48 L273.03,187.19 L275.40,186.96 L277.77,186.80 L280.13,186.70 L282.50,186.67 L284.87,186.70 L287.23,186.80 L289.60,186.96 L291.97,187.19 L294.33,187.48 L296.70,187.84 L299.07,188.26 L301.43,188.75 L303.80,189.31 L306.17,189.93 L308.53,190.61 L310.90,191.36 L313.27,192.17 L315.63,193.05 L318.00,194.00 L320.37,195.01 L322.73,196.09 L325.10,197.23 L327.47,198.43 L329.83,199.70 L332.20,201.04 L334.57,2